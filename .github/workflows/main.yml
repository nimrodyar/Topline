name: Validate 10TEN
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run build
      - name: Check HTML and API validation
        run: |
          node <<'JS'
          const {spawn} = require('node:child_process');
          const assert = require('node:assert/strict');
          const server = spawn(process.execPath, ['node_modules/next/dist/bin/next','start','--hostname','127.0.0.1','--port','3000']);
          let started = false;
          const timeout = setTimeout(()=>{server.kill();process.exit(1)},30000);
          server.stderr.pipe(process.stderr);
          server.stdout.on('data',async chunk=>{
            if(started || !chunk.toString().includes('Ready')) return;
            started=true;
            try {
              const html=await (await fetch('http://127.0.0.1:3000')).text();
              assert.match(html, /lang="he"/); assert.match(html, /dir="rtl"/);
              const categories=await (await fetch('http://127.0.0.1:3000/api/categories')).json();
              assert(categories.categories.includes('sports'));
              for(const path of ['/api/news?page=0','/api/news?category=invalid','/api/news?page=1.5']) {
                assert.equal((await fetch('http://127.0.0.1:3000'+path)).status,400);
              }
              assert.equal((await fetch('http://127.0.0.1:3000/api/unknown')).status,404);
              console.log('HTML and API smoke checks passed');
            } catch(error) { console.error(error); process.exitCode=1; }
            finally { clearTimeout(timeout); server.kill(); }
          });
          JS
